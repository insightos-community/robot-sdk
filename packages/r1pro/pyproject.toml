[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-robot-sdk-r1pro"
version = "0.5.6"
description = "R1 Pro 真机与仿真统一 Robot SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["semantic-robot-sdk-core==0.5.0.dev0"]

[project.optional-dependencies]
isaac = ["numpy>=1.26,<3", "scipy>=1.10,<2"]
mujoco = ["websockets==17.0.1"]
planning = ["numpy>=1.26,<3", "pin>=3.0,<4", "ruckig>=0.14,<1"]

[tool.uv.sources]
semantic-robot-sdk-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"galaxea_r1pro.galaxea_r1pro_0.utils" = ["data/*.json"]
