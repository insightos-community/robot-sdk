[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-robot-sdk-franka"
version = "0.5.0.dev0"
description = "Franka Robot SDK 接口验证包"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["semantic-robot-sdk-core==0.5.0.dev0"]

[project.optional-dependencies]
planning = ["numpy>=1.26,<3", "pin>=3.0,<4", "ruckig>=0.14,<1"]

[tool.uv.sources]
semantic-robot-sdk-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
