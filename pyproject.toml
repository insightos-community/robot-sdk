[tool.uv.workspace]
members = ["packages/core", "packages/r1pro", "packages/franka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core/src", "packages/r1pro/src", "packages/franka/src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
test = ["pytest>=8,<9", "ruff==0.15.17"]
